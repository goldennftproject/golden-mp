<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Farm · Zona compartida</title>
<style>
  html,body{margin:0;height:100%;background:#5f8f43;font-family:system-ui,sans-serif;overflow:hidden}
  #game{position:fixed;inset:0}
  #game canvas{display:block}
  #hud{position:fixed;top:10px;left:10px;z-index:5;background:rgba(20,28,15,.72);color:#f2ead5;
       padding:8px 12px;border-radius:10px;font-size:13px;line-height:1.5;pointer-events:none}
  #hud b{color:#ffd76a}
  #gate{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#243318}
  #gate .card{background:#0f150b;color:#f2ead5;border:1px solid #3c4d31;border-radius:16px;padding:26px 28px;width:min(420px,92%);text-align:center}
  #gate h1{color:#e2b23a;margin:0 0 6px}
  #gate p{color:#cbbf9f;font-size:14px;margin:0 0 16px}
  #gate input{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #4a5c3a;background:#1a2413;color:#fff;font-size:15px;text-align:center;margin-bottom:12px}
  #gate button{width:100%;padding:12px;border:none;border-radius:10px;font-weight:800;font-size:15px;
       background:linear-gradient(#f6d878,#e9b93f);color:#3a2e10;cursor:pointer}
  #status{position:fixed;bottom:10px;left:10px;z-index:5;background:rgba(20,28,15,.72);color:#a9d18b;padding:6px 10px;border-radius:8px;font-size:12px}
</style>
</head>
<body>
  <div id="game"></div>
  <div id="hud">
    <b>Zona compartida · Golden Farm</b><br>
    Moverte: <b>WASD</b> o flechas · diagonal permitida<br>
    Abrí esta URL en <b>otra pestaña</b> para verte moviéndote en vivo.
  </div>
  <div id="status">Conectando…</div>

  <div id="gate">
    <div class="card">
      <h1>Golden Farm</h1>
      <p>Elegí un apodo para entrar a la zona compartida.</p>
      <input id="nick" maxlength="14" placeholder="Tu apodo" autocomplete="off">
      <button id="enter">Entrar a la plaza</button>
    </div>
  </div>

  <!-- CONFIG: URL del servidor Colyseus.
       - Deploy TODO-EN-UNO en Render: dejalo en "" (el mismo server sirve esta página).
       - Cliente en Vercel + server en Render: poné acá la URL wss:// de tu server en Render.
         Ej: window.GOLDEN_SERVER = "wss://golden-mp-xxxx.onrender.com"; -->
  <script>window.GOLDEN_SERVER = "";</script>

  <!-- Phaser y Colyseus desde CDN (tu navegador tiene internet; el sandbox de la nube no) -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/colyseus.js@0.15/dist/colyseus.js"></script>
  <script>
    // Aviso claro si la librería del cliente no cargó (evita el confuso "No se pudo conectar")
    if (typeof Colyseus === "undefined") {
      var s = document.getElementById("status");
      if (s) s.textContent = "🔴 No cargó colyseus.js (CDN). Revisá tu conexión y recargá.";
    }
  </script>
  <script src="game.js"></script>
</body>
</html>
