<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Farm</title>
<style>
  html,body{margin:0;height:100%;background:#5f8f43;font-family:system-ui,sans-serif;overflow:hidden}
  #game{position:fixed;inset:0}
  #game canvas{display:block}
  #status{position:fixed;bottom:8px;left:8px;z-index:5;color:#a9d18b;font:12px system-ui;background:rgba(20,28,15,.7);padding:4px 8px;border-radius:6px}
  #gate{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#243318}
  #gate .card{background:#0f150b;color:#f2ead5;border:1px solid #3c4d31;border-radius:16px;padding:26px 28px;width:min(420px,92%);text-align:center}
  #gate h1{color:#e2b23a;margin:0 0 6px;letter-spacing:1px}
  #gate p{color:#cbbf9f;font-size:14px;margin:0 0 16px}
  #gate input{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #4a5c3a;background:#1a2413;color:#fff;font-size:15px;text-align:center;margin-bottom:12px}
  #gate button{width:100%;padding:12px;border:none;border-radius:10px;font-weight:800;font-size:15px;background:linear-gradient(#f6d878,#e9b93f);color:#3a2e10;cursor:pointer}
</style>
</head>
<body>
  <div id="game"></div>
  <div id="status"></div>

  <div id="gate">
    <div class="card">
      <h1>GOLDEN FARM</h1>
      <p>Elegí un apodo para entrar a tu granja.</p>
      <input id="nick" maxlength="14" placeholder="Tu apodo" autocomplete="off">
      <button id="enter">Entrar</button>
    </div>
  </div>

  <!-- CONFIG: URL del servidor Colyseus. "" = mismo origen (Render todo-en-uno). -->
  <script>window.GOLDEN_SERVER = "";</script>

  <!-- Phaser -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <!-- colyseus.js para navegador (esm.sh, con polyfill de Buffer) -->
  <script type="module">
    try {
      const mod = await import("https://esm.sh/colyseus.js@0.15");
      window.Colyseus = mod; window.__colyseusReady = true;
      window.dispatchEvent(new Event("colyseus-ready"));
    } catch (e) {
      console.error("colyseus.js no cargó:", e);
      const s = document.getElementById("status"); if (s) s.textContent = "🔴 No cargó la red (colyseus.js).";
    }
  </script>

  <!-- juego -->
  <script src="game/config.js"></script>
  <script src="game/boot.js"></script>
  <script src="game/farm.js"></script>
  <script src="game/plaza.js"></script>
  <script src="game/main.js"></script>
</body>
</html>
