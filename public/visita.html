<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visita a una granja · Golden Farm</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#233d20;color:#fff5d4;font:16px system-ui}header{position:fixed;z-index:2;inset:12px 12px auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:#704425;border:3px solid #c2924d;border-radius:8px;box-shadow:0 3px 12px #0008}h1{font-size:19px;margin:0}small{color:#ead6b4}button{cursor:pointer;background:#704425;border:3px solid #c2924d;border-radius:8px;color:#fff5d4;padding:10px 16px;font-weight:700;font-size:15px}button:hover{background:#916037}button:focus-visible{outline:3px solid white}button:disabled{cursor:default;opacity:.7}#mundo{height:100vh;overflow:auto;display:grid;place-items:center;padding:100px 48px 96px;overscroll-behavior:contain}#mapa{position:relative;width:max-content}canvas{display:block;image-rendering:pixelated}#semilla{position:absolute;transform:translate(-50%,-100%);background:#ead9a6;color:#39311b;white-space:nowrap;box-shadow:0 2px 10px #0008}footer{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#23351de8;padding:10px 20px;border-radius:8px;text-align:center;max-width:90vw}#estado{margin:0}
</style>
<header><div><h1 id="titulo">Viajando a la granja…</h1><small>Visita · Solo lectura</small></div><button id="volver">← Volver a mi granja</button></header>
<main id="mundo"><div id="mapa"><canvas id="lienzo" aria-label="Granja visitada, solo lectura"></canvas><button id="semilla" hidden>🌱 Recoger semilla</button></div></main>
<footer><p id="estado" role="status">Cargando la granja…</p></footer>
<script src="game/config.js"></script><script src="game/visita-mapa.js"></script></html>
